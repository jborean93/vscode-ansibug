name: Publish ansibug

# Publishes the vsix of the release ci.yml drafted for a tag.
on:
  release:
    types:
    - published

permissions: {}

jobs:
  publish:
    name: Publish to the marketplaces
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=jborean.ansibug
    permissions:
      contents: read  # Repo checkout and download the release assets
      attestations: read  # Verify the vsix's build provenance
      id-token: write  # Marketplace and OpenVSX trusted publishing

    steps:
    # Only for the lockfile pinned vsce and ovsx, the vsix itself comes from the release.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install the dependencies
      run: npm ci --ignore-scripts

    - name: Download the vsix from the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        gh release download "$TAG" --pattern '*.vsix' --dir dist --repo "$GITHUB_REPOSITORY"
        ls dist
        test "$(ls dist/*.vsix | wc -l)" -eq 1

    # Anyone with write access can add files to a release, so only publish what ci.yml built from this tag.
    - name: Verify the vsix was built by ci.yml from the tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        gh attestation verify dist/*.vsix \
          --repo "$GITHUB_REPOSITORY" \
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
          --source-ref "refs/tags/$TAG" \
          --deny-self-hosted-runners

    - name: Publish to OpenVSX Registry
      run: npx ovsx publish --trusted-publishing --packagePath dist/*.vsix

    - name: Publish to VSCode Marketplace
      run: npx vsce publish --oidc --packagePath dist/*.vsix
